    <script>
      // Intercepta la llamada __jsonp para anular el bloqueo del trial
      window.__jsonp = function(filename, data) {
        if (typeof data === "string") {
          try {
            var decoded = JSON.parse(atob(data));
            if (decoded.deliveryPolicy) {
              decoded.deliveryPolicy.access = "allowed";
              decoded.deliveryPolicy.reason = "none";
              decoded.deliveryPolicy.accessExpiresAt = null;
            }
            window.__jsonp(filename, decoded);
            return;
          } catch(e) {}
        }
      };
    </script>
