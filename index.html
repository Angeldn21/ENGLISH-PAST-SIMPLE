<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aprendiendo las reglas del Pasado Simple en Inglés Class</title>
    
    <script type="application/json" id="__CONFIG__">
      {"assetTargetPrefixes":{"media":"assets","font":"lib/fonts"},"loadOnlyInLms":false,"surface":"web-export"}
    </script>

    <script>
      // Almacenador global para interceptar el jsonp antes de iniciar el reproductor
      window.__jsonpData = {};
      window.__jsonp = function(filename, data) {
        if (filename === "runtime-data.js" && data) {
          if (typeof data === "string") {
            try { data = JSON.parse(atob(data)); } catch(e) {}
          }
          if (typeof data === "object") {
            data.deliveryPolicy = { status: "resolved", access: "allowed", protection: "none" };
          }
        }
        window.__jsonpData[filename] = data;
      };
    </script>

    <!-- Cargar primero el archivo de datos -->
    <script src="runtime-data.js"></script>

    <script>
      // Restaurar el receptor antes de cargar los scripts pesados de Rise
      (function() {
        var originalData = window.__jsonpData["runtime-data.js"];
        delete window.__jsonp;
        
        // Define el hook para cuando lib/dist se ejecute
        Object.defineProperty(window, '__jsonp', {
          get: function() {
            return window.__jsonpHandler || function(file, d) {};
          },
          set: function(fn) {
            window.__jsonpHandler = fn;
            if (originalData) {
              fn("runtime-data.js", originalData);
            }
          },
          configurable: true
        });
      })();
    </script>

    <script src="lib/dist/7137cfb8.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script src="lib/rise/28b41e6c.js"></script>
  </body>
</html>
